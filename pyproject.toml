[project]
name = "supply-chain-ai-copilot"
version = "0.1.0"
description = "Enterprise supply chain & ESG AI copilot: LightGBM demand forecasting, hybrid RAG, LangGraph agent."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs live PostgreSQL/pgvector or Redis (set DATABASE_URL / REDIS_URL)",
]
